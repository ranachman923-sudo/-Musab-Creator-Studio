<!-- اس کوڈ کو کاپی کریں، یہ اب "فری ہینڈ" ہے -->
<div class="input-group">
    <label>کاروبار کی قسم (Category/Service):</label>
    <!-- اب سلیکٹ کی جگہ ان پٹ باکس ہے، جو مرضی لکھیں -->
    <input type="text" id="catInput" placeholder="مثلاً: پراپرٹی ڈیلر، ٹیلرنگ، الیکٹرونکس وغیرہ..." value="جنٹس ٹیلرنگ">
</div>

<script>
    function generateCard() {
        // باقی سب کوڈ وہی ہے، بس کیٹگری کو اب ٹیکسٹ باکس سے لے رہے ہیں
        let shop = document.getElementById('shopInput').value;
        let cat = document.getElementById('catInput').value; // یہ اب یوزر کی مرضی کا ٹیکسٹ لے گا
        let owner = document.getElementById('ownerInput').value;
        let phone = document.getElementById('phoneInput').value;

        document.getElementById('cardShop').innerText = shop;
        document.getElementById('cardCat').innerText = cat; // جو یوزر لکھے گا، وہی کارڈ پر آئے گا
        document.getElementById('cardOwner').innerText = owner;
        document.getElementById('cardPhone').innerText = "فون: " + phone;
    }
</script>
