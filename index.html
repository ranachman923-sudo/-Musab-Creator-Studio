<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Musab Studio - Premium Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 90%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-box { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 15px; border-radius: 12px; border: none; background: #1a1f29; color: white; outline: none; }
        button { padding: 15px; border-radius: 12px; border: none; background: linear-gradient(90deg, #6366f1, #a855f7); color: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { transform: scale(1.05); }

        /* پریمیم کارڈ اسٹائل */
        .card-preview { width: 350px; height: 200px; background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 20px; padding: 25px; border: 1px solid #4f46e5; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        .card-preview::before { content: ""; position: absolute; top: -10px; right: -10px; width: 50px; height: 50px; background: #6366f1; border-radius: 50%; opacity: 0.3; }
        h2 { margin: 0; color: #6366f1; font-family: 'Jameel Noori Nastaleeq', serif; font-size: 28px; }
        .cat { color: #94a3b8; font-size: 14px; }
        .owner { font-weight: bold; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="input-box">
        <h2 style="color:white; font-family: sans-serif;">کارڈ کی تفصیلات</h2>
        <input type="text" id="shop" placeholder="دکان کا نام">
        <input type="text" id="cat" placeholder="کام کی قسم">
        <input type="text" id="owner" placeholder="مالک کا نام">
        <input type="text" id="phone" placeholder="فون نمبر">
        <button onclick="updateCard()">کارڈ پرنٹ کریں</button>
    </div>

    <div class="card-preview">
        <div>
            <h2 id="outShop">آپ کی دکان</h2>
            <div class="cat" id="outCat">کام کی قسم</div>
        </div>
        <div>
            <div class="owner" id="outOwner">مالک کا نام</div>
            <div style="font-size: 12px; color: #6366f1;" id="outPhone">0300-0000000</div>
        </div>
    </div>
</div>

<script>
    function updateCard() {
        document.getElementById('outShop').innerText = document.getElementById('shop').value;
        document.getElementById('outCat').innerText = document.getElementById('cat').value;
        document.getElementById('outOwner').innerText = document.getElementById('owner').value;
        document.getElementById('outPhone').innerText = document.getElementById('phone').value;
    }
</script>

</body>
</html>
